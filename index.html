<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101116">
    <title>Vantry - Connect your world</title>
    <style>
        :root {
            --bg: #101116; --panel: #191a22; --card: #20212b; --line: #30313d;
            --text: #f5f6fa; --muted: #a2a3b3; --accent: #9b87ff;
            --accent2: #7358ee; --danger: #ff697d; --green: #5dd6a0;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        body { padding-bottom: 90px; }
        button, input, textarea { font: inherit; }
        button { cursor: pointer; }
        
        .topbar {
            height: 62px; padding: 0 16px; display: flex; align-items: center;
            justify-content: space-between; background: var(--bg);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #ffffff0b;
        }
        .brand { font-size: 23px; font-weight: 850; letter-spacing: -.6px; color: var(--accent); }
        
        .main-content { width: 100%; padding: 12px 24px; margin: 0 auto; max-width: 600px; }
        .page-view { display: none; }
        .page-view.active { display: block; }
        .cardbackground { background: var(--panel); border: 1px solid #ffffff0b; border-radius: 19px; padding: 16px; margin-bottom: 16px; }
        
        /* Bottom Tab Navigation Matrix */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: var(--panel); border-top: 1px solid var(--line);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item {
            background: transparent; border: none; color: var(--muted);
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px;
        }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }

        /* Feed Elements */
        .create-box { display: flex; flex-direction: column; gap: 10px; }
        .create-prompt { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; color: var(--text); outline: none; resize: none; }
        .action-post { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 600; align-self: flex-end; }
        .post-card { background: var(--panel); border: 1px solid #ffffff0b; border-radius: 19px; padding: 16px; margin-bottom: 12px; }
        .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .post-meta { display: flex; flex-direction: column; }
        .post-author { font-weight: 750; font-size: 14px; }
        .post-text { font-size: 14px; line-height: 1.6; }

        /* Chat Window UI */
        .chat-history { height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding: 12px; background: var(--card); border-radius: 12px; border: 1px solid var(--line); }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-field { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; color: var(--text); outline: none; }
        .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .chat-bubble.incoming { background: var(--line); align-self: flex-start; }
        .chat-bubble.outgoing { background: var(--accent); color: white; align-self: flex-end; }

        /* Profile Form */
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-field { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: var(--text); outline: none; }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="brand">Vantry</div>
    </header>

    <main class="main-content">
        
        <!-- PAGE 1: HOME WALL FEED -->
        <section id="page-feed" class="page-view active">
            <div class="cardbackground">
                <div class="create-box">
                    <textarea id="post-input" class="create-prompt" rows="2" placeholder="What's on your mind?"></textarea>
                    <button id="submit-post" class="action-post">➕ Post</button>
                </div>
            </div>
            <h3>Latest posts</h3>
            <div id="posts-container"></div>
        </section>

        <!-- PAGE 2: LIVE CHATROOM -->
        <section id="page-chats" class="page-view">
            <h3>Global Chatroom</h3>
            <div class="cardbackground">
                <div id="chat-window" class="chat-history"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" class="chat-field" placeholder="Type a message...">
                    <button id="submit-chat" class="action-post">Send</button>
                </div>
            </div>
        </section>

        <!-- PAGE 3: USER PROFILES -->
        <section id="page-profile" class="page-view">
            <h3>Your Profile</h3>
            <div class="cardbackground">
                <div class="input-group">
                    <label style="color: var(--muted); font-size: 13px;">Display Name</label>
                    <input type="text" id="profile-name-input" class="input-field" placeholder="Set your username...">
                </div>
                <button id="save-profile" class="action-post" style="width: 100%;">Update Username</button>
            </div>
        </section>

    </main>

    <!-- Bottom Tab Navigation Layout -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('page-feed', this)">
            <span class="nav-icon">🏠</span><span>Home</span>
        </button>
        <button class="nav-item" onclick="switchPage('page-chats', this)">
            <span class="nav-icon">💬</span><span>Chats</span>
        </button>
        <button class="nav-item" onclick="switchPage('page-profile', this)">
            <span class="nav-icon">👤</span><span>Profile</span>
        </button>
    </nav>

    <!-- FIREBASE PLATFORM IMPLEMENTATION -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://gstatic.com";

        const firebaseConfig = {
          apiKey: "AIzaSyBJXWMVvvHSlO4GWCnBQDeHXHxRtzLC2uA",
          authDomain: "vantry-200d3.firebaseapp.com",
          projectId: "vantry-200d3",
          storageBucket: "vantry-200d3.firebasestorage.app",
          messagingSenderId: "787639375643",
          appId: "1:787639375643:web:5056ecb877eeedcdf965be"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Assign a random default username so users look distinct from each other right away
        let currentUser = localStorage.getItem('vantry_user') || 'User_' + Math.floor(Math.random() * 9000 + 1000);
        document.getElementById('profile-name-input').value = currentUser;

        // View router functionality
        window.switchPage = function(pageId, buttonElement) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            buttonElement.classList.add('active');
        }

        // Save username configuration
        document.getElementById('save-profile').addEventListener('click', () => {
            const enteredName = document.getElementById('profile-name-input').value.trim();
            if(enteredName) {
                currentUser = enteredName;
                localStorage.setItem('vantry_user', enteredName);
                alert('Username updated to: ' + enteredName);
            }
        });

        // ==================== TIMELINE CODE BLOCK ====================
        const postInput = document.getElementById('post-input');
        const submitPost = document.getElementById('submit-post');
        const postsContainer = document.getElementById('posts-container');

        submitPost.addEventListener('click', async () => {
            const text = postInput.value.trim();
            if (text !== "") {
                try {
                    await addDoc(collection(db, "posts"), {
                        content: text,
                        timestamp: new Date(),
                        author: currentUser
                    });
                    postInput.value = "";
                } catch(e) { console.error("Database block error: ", e); }
            }
        });

        onSnapshot(query(collection(db, "posts"), orderBy("timestamp", "desc")), (snap) => {
            postsContainer.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                const card = document.createElement('div');
                card.classList.add('post-card');
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-avatar">${data.author ? data.author.charAt(0).toUpperCase() : 'U'}</div>
                        <div class="post-meta">
