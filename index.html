  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101116">
    <title>Vantry - Connect your world</title>
    <style>
        :root {
            --bg: #101116; --panel: #191a22; --card: #20212b; --line: #30313d;
            --text: #f5f6fa; --muted: #a2a3b3; --accent: #9b87ff;
            --accent2: #7358ee; --danger: #ff697d; --green: #5dd6a0;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }
        .topbar {
            height: 62px; padding: 0 16px; display: flex; align-items: center;
            justify-content: space-between; background: var(--bg);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #ffffff0b;
        }
        .brand { font-size: 23px; font-weight: 850; letter-spacing: -.6px; color: var(--accent); }
        .main { width: 100%; padding: 12px 24px; margin: 0 auto; }
        .cardbackground { background: var(--panel); border: 1px solid #ffffff0b; border-radius: 19px; padding: 14px; margin-bottom: 12px; }
        .stories { display: flex; gap: 12px; overflow-x: auto; padding: 3px 1px 12px; }
        .stories::-webkit-scrollbar { display: none; }
        .story-ring {
            width: 68px; height: 68px; margin: 0 auto; padding: 3px; border-radius: 50%;
            background: linear-gradient(135deg, #c29aff, #7957ff, #ff7cbb);
        }
        .story-inner { height: 100%; width: 100%; color: #fff; border-radius: 50%; border: 3px solid var(--bg); background: var(--card); display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: bold; }
        .create-box { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .create-prompt { flex: 1; text-align: left; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 13px; width: 100%; outline: none; resize: none;}
        .post-actions { display: flex; gap: 6px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; width: 100%; }
        .action { flex: 1; background: transparent; border: none; color: var(--muted); border-radius: 10px; padding: 10px 2px; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .action:hover { background: var(--card); color: var(--text); }
        .action-post { background: var(--accent); color: #fff; border-radius: 12px; }
        .action-post:hover { background: var(--accent2); }
        .search-container { margin-bottom: 16px; }
        .search-bar { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 12px; color: var(--text); outline: none; }
        .post-card { background: var(--panel); border: 1px solid #ffffff0b; border-radius: 19px; padding: 16px; margin-bottom: 12px; }
        .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .post-meta { display: flex; flex-direction: column; }
        .post-author { font-weight: 750; font-size: 14px; }
        .post-time { font-size: 11px; color: var(--muted); }
        .post-text { font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="brand">Vantry</div>
    </header>

    <main class="main">
        <!-- Stories Section -->
        <div class="stories">
            <div>
                <div class="story-ring"><div class="story-inner">V</div></div>
            </div>
        </div>

        <!-- Create Post Box -->
        <div class="cardbackground">
            <div class="create-box">
                <textarea id="post-input" class="create-prompt" rows="2" placeholder="What's on your mind?"></textarea>
                <div class="post-actions">
                    <button class="action">🖼️ Photo</button>
                    <button class="action">🎥 Video</button>
                    <button id="submit-post" class="action action-post">➕ Post</button>
                </div>
            </div>
        </div>

        <!-- Search Feed -->
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search posts and people...">
        </div>

        <h3>Latest posts</h3>
        
        <!-- Live Post Feed Container -->
        <div id="posts-feed"></div>
    </main>

    <!-- FIREBASE SERVICES IMPLEMENTATION -->
    <script type="module">
        // Importing modules via browser-supported web URLs instead of npm strings
        import { initializeApp } from "https://gstatic.com";
        import { getAnalytics } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://gstatic.com";

        // Your exact Firebase project configurations
        const firebaseConfig = {
          apiKey: "AIzaSyBJXWMVvvHSlO4GWCnBQDeHXHxRtzLC2uA",
          authDomain: "vantry-200d3.firebaseapp.com",
          projectId: "vantry-200d3",
          storageBucket: "vantry-200d3.firebasestorage.app",
          messagingSenderId: "787639375643",
          appId: "1:787639375643:web:5056ecb877eeedcdf965be",
          measurementId: "G-8NNJPV20D8"
        };

        // Initialize Firebase instances
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Bind interactive user interface text areas
        const postInput = document.getElementById('post-input');
        const submitPost = document.getElementById('submit-post');
        const postsFeed = document.getElementById('posts-feed');

        // Click event listener script to send posts up to Firestore
        async function sendPost() {
            const text = postInput.value.trim();
            if (text !== "") {
                try {
                    await addDoc(collection(db, "posts"), {
                        content: text,
                        timestamp: new Date(),
                        author: "Vantry User" 
                    });
                    postInput.value = ""; 
                } catch (error) {
                    console.error("Error publishing post: ", error);
                }
            }
        }

        submitPost.addEventListener('click', sendPost);

        // Realtime sync listener setup to feed display updates down immediately
        const postsQuery = query(collection(db, "posts"), orderBy("timestamp", "desc"));
        onSnapshot(postsQuery, (snapshot) => {
            postsFeed.innerHTML = ""; 
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                
                const postCard = document.createElement('div');
                postCard.classList.add('post-card');
                
                postCard.innerHTML = `
                    <div class="post-header">
                        <div class="post-avatar">${data.author ? data.author.charAt(0) : 'U'}</div>
                        <div class="post-meta">
                            <span class="post-author">${data.author || 'Anonymous'}</span>
                            <span class="post-time">Just now</span>
                        </div>
                    </div>
                    <div class="post-text">${data.content}</div>
                `;
                postsFeed.appendChild(postCard);
            });
        });
    </script>
</body>
</html>
